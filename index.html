<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d20">
<title>꿈을 세금으로 걷는 도시</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="city" aria-hidden="true"></div>
<main class="shell">
<header><span class="sigil" aria-hidden="true">✦</span> 꿈을 세금으로 걷는 도시 <span class="edition">정전의 밤</span></header>
<div id="meter" hidden><div class="meter-label"><span>탐험 진행률</span><span id="count"></span></div><progress id="progress" max="16" value="0" aria-label="완료한 선택 수"></progress></div>
<section id="scene" class="panel" aria-labelledby="heading"></section>
<p id="notice" role="status"></p>
<footer>정전의 밤에 태어난 16가지 전설</footer>
</main>
</body>
</html>
